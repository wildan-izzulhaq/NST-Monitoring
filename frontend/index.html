<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NST Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- MQTT.js untuk koneksi WebSocket ke HiveMQ -->
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f8f4ef; font-family: 'Nunito', sans-serif; }
    @keyframes pulse-ring {
      0%   { transform: scale(1);   opacity: .7; }
      70%  { transform: scale(1.6); opacity: 0;  }
      100% { transform: scale(1.6); opacity: 0;  }
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    @keyframes blink-alarm {
      0%, 100% { opacity: 1;  }
      50%       { opacity: .3; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bounce-in {
      0%   { transform: scale(.4); opacity: 0;  }
      70%  { transform: scale(1.2);              }
      100% { transform: scale(1);  opacity: 1;  }
    }
    .card-h { transition: transform .2s, box-shadow .2s; }
    .card-h:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(0,0,0,.10) !important; }
    .tab-btn:hover { color: #f43f5e !important; }
    .hist-row { cursor: pointer; transition: all .2s; }
    .pasien-card { cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
    .pasien-card:hover { transform: translateY(-2px); border-color: #fda4af !important; box-shadow: 0 8px 28px rgba(253,164,175,.25) !important; }
    .hist-row:hover { border-color: #fda4af !important; background: rgba(255,255,255,.95) !important; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

const { useState, useEffect, useRef, useCallback } = React;

// API endpoints
const API_LATEST      = "./api/latest.php";
const API_HISTORY     = "./api/history.php";
const API_HISTORY_DATA = "./api/history_data.php";
const API_PATIENTS     = "./api/patients.php";
const API_ACTIVE       = "./api/active_patient.php";
const POLL_MS         = 500;
const OFFLINE_MS      = 10000;

// Konfigurasi MQTT HiveMQ
const MQTT_HOST   = "";
const MQTT_PORT   = "";
const MQTT_USER   = "";
const MQTT_PASS   = "";
const TOPIC_FHR   = "nst/fhr";
const TOPIC_TOCO  = "nst/toco";

// Konstanta skala kertas NST
const DATA_INTERVAL_S = 0.5;
const PX_PER_MIN  = 84;              
const PX_PER_SEC  = PX_PER_MIN / 60;
const PX_PER_PT   = PX_PER_SEC * DATA_INTERVAL_S;
const PTS_PER_MAJOR = Math.round(60 / DATA_INTERVAL_S);

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, info) { console.error("[ErrorBoundary]", error, info); }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{padding:40, fontFamily:"monospace", color:"#b91c1c", background:"#fff1f2",
          minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center"}}>
          <div style={{fontSize:40, marginBottom:16}}>⚠️</div>
          <div style={{fontSize:18, fontWeight:700, marginBottom:12}}>Terjadi Error</div>
          <div style={{fontSize:12, color:"#64748b", maxWidth:600, textAlign:"center", marginBottom:20}}>
            {String(this.state.error)}
          </div>
          <button onClick={() => window.location.reload()}
            style={{padding:"10px 24px", background:"#f43f5e", border:"none", borderRadius:8,
              color:"#fff", fontWeight:700, cursor:"pointer", fontSize:14}}>
            🔄 Refresh Halaman
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

const F = "'Nunito', sans-serif";
const M = "'DM Mono', monospace";
const KEMENKES_LOGO = "./logo_kemenkes.png";


// Klasifikasi status
const sBPM = b => {
  if (!b || b <= 0)   return "NoSignal";
  if (b < 110)        return "Bradikardi";
  if (b < 119)        return "Waspada";
  if (b <= 160)       return "Normal";
  return "Takikardi";
};
const sTOCO = t => {
  if (t === null || t === undefined) return "-";
  if (t < 5)   return "Tidak Ada/BH";
  if (t < 25)  return "Hipotonik";
  if (t < 80)  return "Normal";
  return "Hipertonik";
};

const isBPMNormal  = b => sBPM(b)  === "Normal";
const isTOCONormal = t => sTOCO(t) === "Normal";

function fmtDate(str) {
  if (!str) return "-";
  const d = new Date(str.replace(" ", "T"));
  return d.toLocaleDateString("id-ID", { day:"2-digit", month:"short", year:"numeric" });
}
function fmtDatePDF(str) {
  if (!str) return "-";
  const d = new Date((str + " 00:00:00").replace(" ", "T"));
  return d.toLocaleDateString("id-ID", { day:"2-digit", month:"long", year:"numeric" });
}
function fmtTime(str) {
  if (!str) return "-";
  const d = new Date(str.replace(" ", "T"));
  return d.toLocaleTimeString("id-ID", { hour:"2-digit", minute:"2-digit" });
}

// CTG Canvas (Live)
const CTGCanvas = React.forwardRef(function CTGCanvas({ bH, tH, bmIdxs, h = 310 }, fwdRef) {
  const ref = fwdRef || useRef(null);

  useEffect(() => {
    const c = ref.current;
    if (!c) return;
    const ctx = c.getContext("2d");
    const W = c.width, H = c.height;

    // Layout margins
    const PL = 54, PB = 40, PT = 8, PR = 10;
    const GAP = 22;
    const GW = W - PL - PR;
    const GH = H - PT - PB;
    const splitY = PT + GH / 2;
    const bpmY0  = PT;
    const bpmY1  = splitY - GAP / 2;
    const tocoY0 = splitY + GAP / 2;
    const tocoY1 = H - PB;
    const bpmYH  = bpmY1  - bpmY0  - 6;
    const tocoYH = tocoY1 - tocoY0 - 6;
    const bpmMn = 30, bpmMx = 240, tocoMn = 0, tocoMx = 100;

    const n = bH.length;
    const xOf = i => (PL + GW) - (n - 1 - i) * PX_PER_PT;

    ctx.clearRect(0, 0, W, H);

    // Background kertas CTG
    ctx.fillStyle = "#fdf6ec"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fdf0e8"; ctx.fillRect(PL, bpmY0, GW, bpmY1 - bpmY0);
    ctx.fillStyle = "#f0f0f0"; ctx.fillRect(PL, bpmY1, GW, GAP);
    ctx.fillStyle = "#fdf0e8"; ctx.fillRect(PL, tocoY0, GW, tocoY1 - tocoY0);

    // Grid kertas NST
    const pxMinor  = PX_PER_SEC * 10;
    const pxMedium = PX_PER_SEC * 30;
    const pxMajor  = PX_PER_MIN;
    const xRight = PL + GW;

    const drawNSTGrid = (y0, y1) => {
      ctx.lineWidth = 0.5; ctx.strokeStyle = "rgba(180,100,60,0.18)";
      for (let y = y0; y <= y1; y += (y1 - y0) / 8) {
        ctx.beginPath(); ctx.moveTo(PL, y); ctx.lineTo(PL + GW, y); ctx.stroke();
      }
      ctx.strokeStyle = "rgba(180,100,60,0.18)"; ctx.lineWidth = 0.5;
      for (let x = xRight; x >= PL; x -= pxMinor) {
        ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
      }
      ctx.strokeStyle = "rgba(160,80,40,0.32)"; ctx.lineWidth = 0.7;
      for (let x = xRight; x >= PL; x -= pxMedium) {
        ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
      }
      ctx.strokeStyle = "rgba(140,60,20,0.55)"; ctx.lineWidth = 1.2;
      for (let x = xRight; x >= PL; x -= pxMajor) {
        ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
      }
    };
    drawNSTGrid(bpmY0,  bpmY1);
    drawNSTGrid(tocoY0, tocoY1);

    ctx.strokeStyle = "rgba(120,70,30,0.4)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PL, bpmY0); ctx.lineTo(PL, tocoY1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PL, tocoY1); ctx.lineTo(PL+GW, tocoY1); ctx.stroke();
    ctx.strokeStyle = "rgba(140,60,20,0.3)"; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(PL, bpmY1); ctx.lineTo(PL+GW, bpmY1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PL, tocoY0); ctx.lineTo(PL+GW, tocoY0); ctx.stroke();

    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.font = "10px 'DM Mono', monospace";
    for (let v = 30; v <= 240; v += 30) {
      const y = bpmY1 - 6 - ((v - bpmMn)/(bpmMx - bpmMn)) * bpmYH;
      if (y < bpmY0 || y > bpmY1) continue;
      ctx.fillStyle = "rgba(120,60,20,0.85)";
      ctx.fillText(v, PL - 6, y);
      ctx.strokeStyle = "rgba(140,60,20,0.3)"; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(PL-3,y); ctx.lineTo(PL,y); ctx.stroke();
    }
    const yBpm110 = bpmY1 - 6 - ((110-bpmMn)/(bpmMx-bpmMn)) * bpmYH;
    const yBpm160 = bpmY1 - 6 - ((160-bpmMn)/(bpmMx-bpmMn)) * bpmYH;
    ctx.fillStyle = "rgba(134,239,172,0.18)";
    ctx.fillRect(PL, yBpm160, GW, yBpm110 - yBpm160);

    [0, 20, 40, 60, 80, 100].forEach(v => {
      const y = tocoY1 - 6 - ((v-tocoMn)/(tocoMx-tocoMn)) * tocoYH;
      ctx.fillStyle = "rgba(120,60,20,0.85)";
      ctx.fillText(v, PL-6, y);
      ctx.strokeStyle = "rgba(140,60,20,0.3)"; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(PL-3,y); ctx.lineTo(PL,y); ctx.stroke();
    });

    ctx.fillStyle = "#94a3b8"; ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.font = "10px 'DM Mono', monospace";
    for (let x = xRight; x >= PL + pxMajor; x -= pxMajor) {
      const secAgo = Math.round((xRight - x) / PX_PER_SEC);
      const m = Math.floor(secAgo / 60), s = secAgo % 60;
      const lbl = `-${m}:${String(s).padStart(2,"0")}`;
      ctx.fillText(lbl, x, tocoY1 + 5);
      ctx.strokeStyle = "rgba(148,163,184,0.3)"; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(x, tocoY1); ctx.lineTo(x, tocoY1 + 3); ctx.stroke();
    }
    ctx.fillStyle = "#16a34a"; ctx.font = "bold 10px 'DM Mono', monospace";
    ctx.fillText("Skrg", xRight, tocoY1 + 5);
    ctx.strokeStyle = "rgba(22,163,74,0.55)"; ctx.lineWidth = 1.5;
    ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(xRight, bpmY0); ctx.lineTo(xRight, tocoY1); ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign = "left"; ctx.fillStyle = "#78350f";
    ctx.font = "bold 9px 'Nunito', sans-serif";
    ctx.fillText("← masa lalu", PL + 4, tocoY1 + 16);
    ctx.textAlign = "right"; ctx.fillStyle = "#15803d";
    ctx.font = "bold 9px 'Nunito', sans-serif";
    ctx.fillText("saat ini →", xRight - 2, tocoY1 + 16);
    ctx.textAlign = "left"; ctx.fillStyle = "#94a3b8";
    ctx.font = "8px 'Nunito', sans-serif";
    ctx.fillText("10det/kotak · 1mnt/major", PL + 4, tocoY1 + 26);

    ctx.save();
    ctx.beginPath();
    ctx.rect(PL, bpmY0, GW, tocoY1 - bpmY0);
    ctx.clip();

    // Gradient fill
    const fill = (data, mn, mx, y0, yh, col, clipY0, clipY1) => {
      const pts = data.map((v, i) => ({ x: xOf(i), y: y0 + yh - ((v-mn)/(mx-mn))*yh }))
                      .filter(p => p.x >= PL);
      if (pts.length < 2) return;
      ctx.save();
      ctx.beginPath(); ctx.rect(PL, clipY0, GW, clipY1 - clipY0); ctx.clip();
      const g = ctx.createLinearGradient(0, y0, 0, y0+yh);
      g.addColorStop(0, col+"44"); g.addColorStop(1, col+"00");
      ctx.beginPath();
      pts.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
      ctx.lineTo(pts[pts.length-1].x, y0+yh); ctx.lineTo(pts[0].x, y0+yh);
      ctx.closePath(); ctx.fillStyle = g; ctx.fill();
      ctx.restore();
    };
    fill(bH, bpmMn, bpmMx, bpmY0+6, bpmYH, "#c0392b", bpmY0, bpmY1);
    fill(tH, tocoMn, tocoMx, tocoY0+6, tocoYH, "#1a5276", tocoY0, tocoY1);

    // Garis utama
    const line = (data, mn, mx, y0, yh, col, clipY0, clipY1) => {
      const pts = data.map((v, i) => ({ x: xOf(i), y: y0 + yh - ((v-mn)/(mx-mn))*yh }))
                      .filter(p => p.x >= PL);
      if (pts.length < 2) return;
      ctx.save();
      ctx.beginPath(); ctx.rect(PL, clipY0, GW, clipY1 - clipY0); ctx.clip();
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineJoin = "round";
      ctx.shadowColor = col; ctx.shadowBlur = 4;
      ctx.beginPath();
      pts.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
      ctx.stroke(); ctx.shadowBlur = 0;
      ctx.restore();
    };
    line(bH, bpmMn, bpmMx, bpmY0+6, bpmYH, "#c0392b", bpmY0, bpmY1);
    line(tH, tocoMn, tocoMx, tocoY0+6, tocoYH, "#1a5276", tocoY0, tocoY1);

    ctx.restore();

    // Bookmark
    bmIdxs.forEach(offsetFromRight => {
      const x = (PL + GW) - offsetFromRight * PX_PER_PT;
      if (x < PL || x > PL + GW) return;

      ctx.save();
      ctx.strokeStyle = "rgba(245,158,11,0.55)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(x, bpmY0+2); ctx.lineTo(x, tocoY1-2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      ctx.beginPath(); ctx.arc(x, splitY, 6, 0, Math.PI*2);
      ctx.fillStyle = "#f59e0b"; ctx.shadowColor = "#f59e0b"; ctx.shadowBlur = 10;
      ctx.fill(); ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.moveTo(x,     bpmY0+14);
      ctx.lineTo(x - 6, bpmY0+24);
      ctx.lineTo(x + 6, bpmY0+24);
      ctx.closePath();
      ctx.fillStyle = "#f59e0b";
      ctx.shadowColor = "#f59e0b"; ctx.shadowBlur = 6;
      ctx.fill(); ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.moveTo(x,     tocoY1-14);
      ctx.lineTo(x - 6, tocoY1-24);
      ctx.lineTo(x + 6, tocoY1-24);
      ctx.closePath();
      ctx.fillStyle = "#f59e0b";
      ctx.shadowColor = "#f59e0b"; ctx.shadowBlur = 6;
      ctx.fill(); ctx.shadowBlur = 0;
    });

    // Label section
    ctx.shadowBlur = 0; ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = "bold 11px 'Nunito', sans-serif";
    ctx.fillStyle = "#c0392b"; ctx.fillText("❤ FHR (bpm)", PL+8, bpmY0+4);
    ctx.fillStyle = "#1a5276"; ctx.fillText("◈ KONTRAKSI (unit)", PL+8, tocoY0+4);

  }, [bH, tH, bmIdxs]);

  return <canvas ref={ref} width={900} height={h}
    style={{ width:"100%", height:"100%", borderRadius:8, display:"block" }} />;
});

// CTG Canvas (History)
function renderCTGCanvas(oc, bpmArr, tocoArr, bmIdxs) {
  const nF  = bpmArr.length;
  const oPL = 60, oPB = 32, oPT = 10, oPR = 12, oGAP = 24;
  const oh  = oc.height;
  const oGW = oc.width - oPL - oPR;
  const octx = oc.getContext("2d");
  const oGH = oh - oPT - oPB, oSplitY = oPT + oGH / 2;
  const oBpmY0 = oPT, oBpmY1 = oSplitY - oGAP / 2;
  const oTocoY0 = oSplitY + oGAP / 2, oTocoY1 = oh - oPB;
  const oBpmYH = oBpmY1 - oBpmY0 - 6, oTocoYH = oTocoY1 - oTocoY0 - 6;
  const bMn = 30, bMx = 240, tMn = 0, tMx = 100;
  const oxOf = i => oPL + i * PX_PER_PT;

  // Latar
  octx.fillStyle = "#fffdf7"; octx.fillRect(0, 0, oc.width, oh);
  octx.fillStyle = "rgba(253,240,232,0.80)"; octx.fillRect(oPL, oBpmY0, oGW, oBpmY1 - oBpmY0);
  octx.fillStyle = "rgba(240,240,240,0.90)"; octx.fillRect(oPL, oBpmY1, oGW, oGAP);
  octx.fillStyle = "rgba(240,248,255,0.80)"; octx.fillRect(oPL, oTocoY0, oGW, oTocoY1 - oTocoY0);

  // Grid NST
  const pxMin = PX_PER_SEC * 10, pxMed = PX_PER_SEC * 30, pxMaj = PX_PER_MIN;
  const drawGrid = (y0, y1, cMin, cMed, cMaj) => {
    octx.lineWidth = 0.5; octx.strokeStyle = cMin;
    for (let y = y0; y <= y1; y += (y1 - y0) / 8) { octx.beginPath(); octx.moveTo(oPL, y); octx.lineTo(oPL + oGW, y); octx.stroke(); }
    for (let x = oPL; x <= oPL + oGW; x += pxMin)  { octx.beginPath(); octx.moveTo(x, y0); octx.lineTo(x, y1); octx.stroke(); }
    octx.strokeStyle = cMed; octx.lineWidth = 0.8;
    for (let x = oPL; x <= oPL + oGW; x += pxMed)  { octx.beginPath(); octx.moveTo(x, y0); octx.lineTo(x, y1); octx.stroke(); }
    octx.strokeStyle = cMaj; octx.lineWidth = 1.5;
    for (let x = oPL; x <= oPL + oGW; x += pxMaj)  { octx.beginPath(); octx.moveTo(x, y0); octx.lineTo(x, y1); octx.stroke(); }
  };
  drawGrid(oBpmY0, oBpmY1,  "rgba(180,100,60,0.18)", "rgba(160,80,40,0.32)",  "rgba(140,60,20,0.55)");
  drawGrid(oTocoY0, oTocoY1,"rgba(80,170,220,0.14)", "rgba(40,130,200,0.25)", "rgba(10,90,170,0.38)");

  octx.strokeStyle = "rgba(120,70,30,0.45)"; octx.lineWidth = 1;
  octx.beginPath(); octx.moveTo(oPL, oBpmY0); octx.lineTo(oPL, oTocoY1); octx.stroke();
  octx.beginPath(); octx.moveTo(oPL, oTocoY1); octx.lineTo(oPL + oGW, oTocoY1); octx.stroke();
  octx.strokeStyle = "rgba(140,60,20,0.3)"; octx.lineWidth = 0.8;
  octx.beginPath(); octx.moveTo(oPL, oBpmY1);  octx.lineTo(oPL + oGW, oBpmY1);  octx.stroke();
  octx.beginPath(); octx.moveTo(oPL, oTocoY0); octx.lineTo(oPL + oGW, oTocoY0); octx.stroke();

  octx.textAlign = "right"; octx.textBaseline = "middle"; octx.font = "12px monospace";
  for (let v = 30; v <= 240; v += 30) {
    const py = oBpmY1 - 6 - ((v - bMn) / (bMx - bMn)) * oBpmYH;
    if (py < oBpmY0 || py > oBpmY1) continue;
    octx.fillStyle = "rgba(192,57,43,0.85)"; octx.fillText(v, oPL - 6, py);
  }
  [0, 20, 40, 60, 80, 100].forEach(v => {
    const py = oTocoY1 - 6 - ((v - tMn) / (tMx - tMn)) * oTocoYH;
    octx.fillStyle = "rgba(26,82,118,0.85)"; octx.fillText(v, oPL - 6, py);
  });

  const yB110 = oBpmY1 - 6 - ((110 - bMn) / (bMx - bMn)) * oBpmYH;
  const yB160 = oBpmY1 - 6 - ((160 - bMn) / (bMx - bMn)) * oBpmYH;
  octx.fillStyle = "rgba(134,239,172,0.18)"; octx.fillRect(oPL, yB160, oGW, yB110 - yB160);

  octx.fillStyle = "rgba(120,60,20,0.7)"; octx.textAlign = "center"; octx.textBaseline = "top"; octx.font = "11px monospace";
  for (let x = oPL; x <= oPL + oGW; x += pxMaj) {
    const sec = Math.round((x - oPL) / PX_PER_SEC);
    const m = Math.floor(sec / 60), s = sec % 60;
    octx.fillText(`${m}:${String(s).padStart(2,"0")}`, x, oTocoY1 + 5);
    octx.strokeStyle = "rgba(140,60,20,0.3)"; octx.lineWidth = 0.7;
    octx.beginPath(); octx.moveTo(x, oTocoY1); octx.lineTo(x, oTocoY1 + 3); octx.stroke();
  }
  octx.textAlign = "right"; octx.fillStyle = "rgba(120,60,20,0.5)"; octx.font = "10px sans-serif";
  octx.fillText("Waktu →", oPL + oGW, oTocoY1 + 18);

  const oFill = (arr, mn, mx, y0, yh, col, clipY0, clipY1) => {
    if (!arr || arr.length < 2) return;
    octx.save();
    octx.beginPath(); octx.rect(oPL, clipY0, oGW, clipY1 - clipY0); octx.clip();
    const g = octx.createLinearGradient(0, y0, 0, y0 + yh);
    g.addColorStop(0, col + "44"); g.addColorStop(1, col + "00");
    octx.beginPath();
    arr.forEach((v, i) => { const x = oxOf(i); const py = y0 + yh - ((v - mn) / (mx - mn)) * yh; i === 0 ? octx.moveTo(x, py) : octx.lineTo(x, py); });
    octx.lineTo(oxOf(arr.length - 1), y0 + yh); octx.lineTo(oPL, y0 + yh); octx.closePath();
    octx.fillStyle = g; octx.fill();
    octx.restore();
  };
  const oLine = (arr, mn, mx, y0, yh, col, clipY0, clipY1) => {
    if (!arr || arr.length < 2) return;
    octx.save();
    octx.beginPath(); octx.rect(oPL, clipY0, oGW, clipY1 - clipY0); octx.clip();
    octx.strokeStyle = col; octx.lineWidth = 2.5; octx.lineJoin = "round";
    octx.shadowColor = col; octx.shadowBlur = 5;
    octx.beginPath();
    arr.forEach((v, i) => { const x = oxOf(i); const py = y0 + yh - ((v - mn) / (mx - mn)) * yh; i === 0 ? octx.moveTo(x, py) : octx.lineTo(x, py); });
    octx.stroke(); octx.shadowBlur = 0;
    octx.restore();
  };

  oFill(bpmArr,  bMn, bMx, oBpmY0 + 6,  oBpmYH,  "#c0392b", oBpmY0, oBpmY1);
  oFill(tocoArr, tMn, tMx, oTocoY0 + 6, oTocoYH, "#1a5276", oTocoY0, oTocoY1);
  oLine(bpmArr,  bMn, bMx, oBpmY0 + 6,  oBpmYH,  "#c0392b", oBpmY0, oBpmY1);
  oLine(tocoArr, tMn, tMx, oTocoY0 + 6, oTocoYH, "#1a5276", oTocoY0, oTocoY1);

  // Bookmark
  (bmIdxs || []).forEach(idx => {
    if (idx >= bpmArr.length) return;
    const x = oxOf(idx);
    octx.save(); octx.strokeStyle = "rgba(245,158,11,0.6)"; octx.lineWidth = 1.5; octx.setLineDash([4, 4]);
    octx.beginPath(); octx.moveTo(x, oBpmY0 + 2); octx.lineTo(x, oTocoY1 - 2); octx.stroke();
    octx.setLineDash([]); octx.restore();
    octx.beginPath(); octx.arc(x, oSplitY, 6, 0, Math.PI * 2);
    octx.fillStyle = "#f59e0b"; octx.shadowColor = "#f59e0b"; octx.shadowBlur = 8; octx.fill(); octx.shadowBlur = 0;
    octx.beginPath(); octx.moveTo(x, oBpmY0+14); octx.lineTo(x-6, oBpmY0+24); octx.lineTo(x+6, oBpmY0+24); octx.closePath();
    octx.fillStyle = "#f59e0b"; octx.shadowColor = "#f59e0b"; octx.shadowBlur = 6; octx.fill(); octx.shadowBlur = 0;
    octx.beginPath(); octx.moveTo(x, oTocoY1-14); octx.lineTo(x-6, oTocoY1-24); octx.lineTo(x+6, oTocoY1-24); octx.closePath();
    octx.fillStyle = "#f59e0b"; octx.shadowColor = "#f59e0b"; octx.shadowBlur = 6; octx.fill(); octx.shadowBlur = 0;
  });

  // Label section
  octx.shadowBlur = 0; octx.textAlign = "left"; octx.textBaseline = "top"; octx.font = "bold 13px sans-serif";
  octx.fillStyle = "#c0392b"; octx.fillText("❤ FHR (bpm)", oPL + 8, oBpmY0 + 4);
  octx.fillStyle = "#1a5276"; octx.fillText("◈ KONTRAKSI (unit)", oPL + 8, oTocoY0 + 4);
}

// FUNGSI PDF (riwayat) & exportPDF (live)
function generateNSTPDF(p) {
  const { jsPDF } = window.jspdf;
  if (!jsPDF) { alert("Library PDF belum siap."); return; }

  const doc = new jsPDF({ orientation:"landscape", unit:"mm", format:"a4" });
  const W=297, H=210, ML=10, MR=10, PW=W-ML-MR;
  const C = {
    tealDark:[14,116,144], teal:[8,145,178], tealLight:[207,250,254],
    green:[22,163,74], greenLight:[220,252,231],
    red:[185,28,28], redLight:[254,226,226],
    slate:[30,41,59], muted:[100,116,139],
    border:[186,230,253],
  };

  // HEADER
  doc.setFillColor(...C.tealDark); doc.rect(0,0,W,22,"F");
  doc.setFillColor(255,255,255); doc.rect(0,21.5,W,0.5,"F");
  doc.setFillColor(255,255,255); doc.roundedRect(5,3,16,16,2,2,"F");
  try { doc.addImage(KEMENKES_LOGO,"PNG",5.5,3.5,15,15); } catch(e){}
  doc.setFontSize(13); doc.setFont("helvetica","bold"); doc.setTextColor(255,255,255);
  doc.text("Laporan Pemeriksaan Non-Stress Test",26,10);
  doc.setFontSize(6.5); doc.setFont("helvetica","normal"); doc.setTextColor(207,250,254);
  doc.text("Kementerian Kesehatan RI  |  Sistem Pemantauan Kardiotokografi (CTG) Digital",26,17);
  const now = new Date();
  const tglCetak = now.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
  const jamCetak = now.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
  doc.setFillColor(255,255,255); doc.roundedRect(W-MR-52,3,52,16,2,2,"F");
  doc.setFontSize(5); doc.setFont("helvetica","normal"); doc.setTextColor(...C.muted);
  doc.text("Dicetak pada:",W-MR-26,7.5,{align:"center"});
  doc.setFontSize(8); doc.setFont("helvetica","bold"); doc.setTextColor(...C.tealDark);
  doc.text(tglCetak,W-MR-26,13,{align:"center"});
  doc.setFontSize(6.5); doc.setFont("helvetica","normal"); doc.setTextColor(...C.teal);
  doc.text("Pukul "+jamCetak,W-MR-26,17.5,{align:"center"});

  let y=30;
  const leftW=PW*0.58, boxH=16;

  // IDENTITAS PASIEN
  doc.setFillColor(...C.border); doc.roundedRect(ML+0.8,y+0.8,leftW,boxH,2,2,"F");
  doc.setFillColor(240,253,255); doc.setDrawColor(...C.teal); doc.setLineWidth(0.5);
  doc.roundedRect(ML,y,leftW,boxH,2,2,"FD");
  doc.setFillColor(...C.tealDark); doc.roundedRect(ML,y,4,boxH,1,1,"F");
  doc.roundedRect(ML+6,y-4.5,40,7,1.5,1.5,"F");
  doc.setFontSize(5.5); doc.setFont("helvetica","bold"); doc.setTextColor(255,255,255);
  doc.text("IDENTITAS PASIEN",ML+26,y+0.5,{align:"center"});
  [{l:"Nama Pasien",v:p.namaP,big:true},{l:"No. Rekam Medis",v:p.rmP},{l:"Usia Kehamilan",v:p.usiaP}].forEach((col,i)=>{
    const cx=ML+6+i*(leftW/3);
    if(i>0){doc.setDrawColor(...C.border);doc.setLineWidth(0.3);doc.line(ML+i*(leftW/3),y+3.5,ML+i*(leftW/3),y+boxH-1);}
    doc.setFontSize(5);doc.setFont("helvetica","normal");doc.setTextColor(...C.muted);doc.text(col.l.toUpperCase(),cx,y+6);
    doc.setFontSize(col.big?9:7.5);doc.setFont("helvetica","bold");doc.setTextColor(...C.slate);doc.text(String(col.v),cx,y+13.5);
  });

  // DATA SESI
  const rightX=ML+leftW+5, rightW=PW-leftW-5;
  doc.setFillColor(...C.border); doc.roundedRect(rightX+0.8,y+0.8,rightW,boxH,2,2,"F");
  doc.setFillColor(240,253,255); doc.setDrawColor(...C.teal); doc.setLineWidth(0.5);
  doc.roundedRect(rightX,y,rightW,boxH,2,2,"FD");
  doc.setFillColor(...C.tealDark); doc.roundedRect(rightX,y,4,boxH,1,1,"F");
  doc.roundedRect(rightX+6,y-4.5,28,7,1.5,1.5,"F");
  doc.setFontSize(5.5);doc.setFont("helvetica","bold");doc.setTextColor(255,255,255);
  doc.text("DATA SESI",rightX+20,y+0.5,{align:"center"});
  [{l:"Tanggal",v:p.tglSesi},{l:"Jam",v:p.jamSesi},{l:"Durasi",v:p.durStr},{l:"Bookmark",v:p.bmStr}].forEach((col,i)=>{
    const cx=rightX+6+i*(rightW/4);
    if(i>0){doc.setDrawColor(...C.border);doc.setLineWidth(0.3);doc.line(rightX+i*(rightW/4),y+3.5,rightX+i*(rightW/4),y+boxH-1);}
    doc.setFontSize(5);doc.setFont("helvetica","normal");doc.setTextColor(...C.muted);doc.text(col.l.toUpperCase(),cx,y+6);
    doc.setFontSize(7.5);doc.setFont("helvetica","bold");doc.setTextColor(...C.slate);doc.text(String(col.v),cx,y+13.5);
  });
  y+=boxH+5;

  // STATISTIK
  const statsH=19, statW=PW/2;
  const bpmOk  = p.avgBpm  !== null && p.avgBpm  >= 110 && p.avgBpm  <= 160;
  const tocoOk = p.avgToco !== null && p.avgToco <= 80;
  const drawStat=(x,w,label,val,unit,ok)=>{
    const col=ok?[...C.green]:[194,65,12];
    const bg =ok?[...C.greenLight]:[255,247,237];
    const bd =ok?[134,239,172]:[253,186,116];
    doc.setFillColor(...bd);doc.roundedRect(x+0.7,y+0.7,w-3,statsH,2,2,"F");
    doc.setFillColor(...bg);doc.setDrawColor(...bd);doc.setLineWidth(0.5);doc.roundedRect(x,y,w-3,statsH,2,2,"FD");
    doc.setFillColor(...col);doc.roundedRect(x,y,4,statsH,1,1,"F");
    doc.setFontSize(5.5);doc.setFont("helvetica","normal");doc.setTextColor(...C.muted);doc.text(label,x+7,y+5.5);
    doc.setFontSize(16);doc.setFont("helvetica","bold");doc.setTextColor(...col);
    doc.text(val!==null?String(val)+unit:"-",x+7,y+14);
    doc.setFontSize(5.5);doc.setFont("helvetica","normal");doc.setTextColor(...C.muted);
    doc.text(ok?(unit==="bpm"?"Normal (110-160 bpm)":"Normal (<80 unit)"):"Di luar rentang normal",x+7,y+17.5);
  };
  drawStat(ML,       statW,"RATA-RATA DETAK JANTUNG JANIN",p.avgBpm, " bpm", bpmOk);
  drawStat(ML+statW, statW,"RATA-RATA TEKANAN KONTRAKSI",  p.avgToco," unit",tocoOk);
  y+=statsH+4;

  // LABEL GRAFIK CTG
  doc.setFillColor(...C.tealDark); doc.roundedRect(ML,y,36,6,1.5,1.5,"F");
  doc.setFontSize(5.5);doc.setFont("helvetica","bold");doc.setTextColor(255,255,255);
  doc.text("GRAFIK CTG",ML+18,y+4,{align:"center"});
  doc.setDrawColor(...C.teal);doc.setLineWidth(0.4);doc.line(ML+36,y+3,ML+PW,y+3);
  y+=7;
  const grafikH=H-y-10;

  // RENDER CANVAS GRAFIK
  try {
    const {bpmArr,tocoArr,bmIdxs,durSec} = p;
    const nF=bpmArr.length;
    const oPL=60,oPB=32,oPT=10,oPR=12,oGAP=24,oh=520;
    
    const oGW = durSec > 0
      ? Math.max(Math.round(durSec * PX_PER_SEC), 900-oPL-oPR)
      : Math.max(900-oPL-oPR, nF*PX_PER_PT);
    const ow=oGW+oPL+oPR;
    const oc=document.createElement("canvas");
    oc.width=ow; oc.height=oh;
    const octx=oc.getContext("2d");

    const oGH=oh-oPT-oPB, oSplitY=oPT+oGH/2;
    const oBpmY0=oPT, oBpmY1=oSplitY-oGAP/2;
    const oTocoY0=oSplitY+oGAP/2, oTocoY1=oh-oPB;
    const oBpmYH=oBpmY1-oBpmY0-6, oTocoYH=oTocoY1-oTocoY0-6;
    const bMn=30,bMx=240,tMn=0,tMx=100;

    const oxOf = i => {
      if (nF <= 1) return oPL;
      const ratio = i / (nF - 1);
      return oPL + ratio * oGW;
    };

    // Latar
    octx.fillStyle="#fffdf7"; octx.fillRect(0,0,ow,oh);
    octx.fillStyle="rgba(253,240,232,0.80)"; octx.fillRect(oPL,oBpmY0,oGW,oBpmY1-oBpmY0);
    octx.fillStyle="rgba(240,240,240,0.90)"; octx.fillRect(oPL,oBpmY1,oGW,oGAP);
    octx.fillStyle="rgba(240,248,255,0.80)"; octx.fillRect(oPL,oTocoY0,oGW,oTocoY1-oTocoY0);

    // Grid NST
    const pxMin=PX_PER_SEC*10, pxMed=PX_PER_SEC*30, pxMaj=PX_PER_MIN;
    const dG=(y0,y1,c1,c2,c3)=>{
      octx.lineWidth=0.5; octx.strokeStyle=c1;
      for(let y=y0;y<=y1;y+=(y1-y0)/8){octx.beginPath();octx.moveTo(oPL,y);octx.lineTo(oPL+oGW,y);octx.stroke();}
      for(let x=oPL;x<=oPL+oGW;x+=pxMin){octx.beginPath();octx.moveTo(x,y0);octx.lineTo(x,y1);octx.stroke();}
      octx.strokeStyle=c2; octx.lineWidth=0.8;
      for(let x=oPL;x<=oPL+oGW;x+=pxMed){octx.beginPath();octx.moveTo(x,y0);octx.lineTo(x,y1);octx.stroke();}
      octx.strokeStyle=c3; octx.lineWidth=1.5;
      for(let x=oPL;x<=oPL+oGW;x+=pxMaj){octx.beginPath();octx.moveTo(x,y0);octx.lineTo(x,y1);octx.stroke();}
    };
    dG(oBpmY0,oBpmY1,"rgba(180,100,60,0.18)","rgba(160,80,40,0.32)","rgba(140,60,20,0.55)");
    dG(oTocoY0,oTocoY1,"rgba(80,170,220,0.14)","rgba(40,130,200,0.25)","rgba(10,90,170,0.38)");

    // Sumbu
    octx.strokeStyle="rgba(120,70,30,0.45)"; octx.lineWidth=1;
    octx.beginPath();octx.moveTo(oPL,oBpmY0);octx.lineTo(oPL,oTocoY1);octx.stroke();
    octx.beginPath();octx.moveTo(oPL,oTocoY1);octx.lineTo(oPL+oGW,oTocoY1);octx.stroke();
    octx.strokeStyle="rgba(140,60,20,0.3)"; octx.lineWidth=0.8;
    octx.beginPath();octx.moveTo(oPL,oBpmY1);octx.lineTo(oPL+oGW,oBpmY1);octx.stroke();
    octx.beginPath();octx.moveTo(oPL,oTocoY0);octx.lineTo(oPL+oGW,oTocoY0);octx.stroke();

    // Label Y
    octx.textAlign="right"; octx.textBaseline="middle"; octx.font="12px monospace";
    for(let v=30;v<=240;v+=30){
      const py=oBpmY1-6-((v-bMn)/(bMx-bMn))*oBpmYH;
      if(py<oBpmY0||py>oBpmY1)continue;
      octx.fillStyle="rgba(192,57,43,0.85)"; octx.fillText(v,oPL-6,py);
    }
    [0,20,40,60,80,100].forEach(v=>{
      const py=oTocoY1-6-((v-tMn)/(tMx-tMn))*oTocoYH;
      octx.fillStyle="rgba(26,82,118,0.85)"; octx.fillText(v,oPL-6,py);
    });

    // Zona normal BPM
    const yB110=oBpmY1-6-((110-bMn)/(bMx-bMn))*oBpmYH, yB160=oBpmY1-6-((160-bMn)/(bMx-bMn))*oBpmYH;
    octx.fillStyle="rgba(134,239,172,0.18)"; octx.fillRect(oPL,yB160,oGW,yB110-yB160);

    // Label X
    const actualIvl = (nF > 1 && durSec > 0) ? durSec/(nF-1) : DATA_INTERVAL_S;
    const ptsMaj    = Math.max(1, Math.round(60/actualIvl));
    octx.fillStyle="rgba(120,60,20,0.7)"; octx.textAlign="center"; octx.textBaseline="top"; octx.font="11px monospace";
    if(nF>1){
      for(let i=0;i<nF;i+=ptsMaj){
        const x=oxOf(i);
        const elSec=Math.round(i*actualIvl);
        const m=Math.floor(elSec/60), s=elSec%60;
        octx.fillText(`${m}:${String(s).padStart(2,"0")}`,x,oTocoY1+5);
        octx.strokeStyle="rgba(140,60,20,0.3)"; octx.lineWidth=0.7;
        octx.beginPath();octx.moveTo(x,oTocoY1);octx.lineTo(x,oTocoY1+3);octx.stroke();
      }
    }
    octx.textAlign="right"; octx.fillStyle="rgba(120,60,20,0.5)"; octx.font="10px sans-serif";
    octx.fillText("Waktu →",oPL+oGW,oTocoY1+18);

    // Fill + Line
    const oFill=(arr,mn,mx,y0,yh,col,clipY0,clipY1)=>{
      if(!arr||arr.length<2)return;
      octx.save();
      octx.beginPath();octx.rect(oPL,clipY0,oGW,clipY1-clipY0);octx.clip();
      const g=octx.createLinearGradient(0,y0,0,y0+yh);
      g.addColorStop(0,col+"44"); g.addColorStop(1,col+"00");
      octx.beginPath();
      arr.forEach((v,i)=>{const x=oxOf(i);const py=y0+yh-((v-mn)/(mx-mn))*yh;i===0?octx.moveTo(x,py):octx.lineTo(x,py);});
      octx.lineTo(oxOf(arr.length-1),y0+yh);octx.lineTo(oPL,y0+yh);octx.closePath();
      octx.fillStyle=g;octx.fill();
      octx.restore();
    };
    const oLine=(arr,mn,mx,y0,yh,col,clipY0,clipY1)=>{
      if(!arr||arr.length<2)return;
      octx.save();
      octx.beginPath();octx.rect(oPL,clipY0,oGW,clipY1-clipY0);octx.clip();
      octx.strokeStyle=col;octx.lineWidth=2.5;octx.lineJoin="round";
      octx.shadowColor=col;octx.shadowBlur=5;
      octx.beginPath();
      arr.forEach((v,i)=>{const x=oxOf(i);const py=y0+yh-((v-mn)/(mx-mn))*yh;i===0?octx.moveTo(x,py):octx.lineTo(x,py);});
      octx.stroke();octx.shadowBlur=0;
      octx.restore();
    };
    oFill(bpmArr, bMn,bMx,oBpmY0+6, oBpmYH, "#c0392b", oBpmY0, oBpmY1);
    oFill(tocoArr,tMn,tMx,oTocoY0+6,oTocoYH,"#1a5276", oTocoY0, oTocoY1);
    oLine(bpmArr, bMn,bMx,oBpmY0+6, oBpmYH, "#c0392b", oBpmY0, oBpmY1);
    oLine(tocoArr,tMn,tMx,oTocoY0+6,oTocoYH,"#1a5276", oTocoY0, oTocoY1);

    // Bookmark
    (bmIdxs||[]).forEach(idx=>{
      if(idx>=bpmArr.length)return;
      const x=oxOf(idx);
      octx.save();octx.strokeStyle="rgba(245,158,11,0.6)";octx.lineWidth=1.5;octx.setLineDash([4,4]);
      octx.beginPath();octx.moveTo(x,oBpmY0+2);octx.lineTo(x,oTocoY1-2);octx.stroke();
      octx.setLineDash([]);octx.restore();
      octx.beginPath();octx.arc(x,oSplitY,6,0,Math.PI*2);
      octx.fillStyle="#f59e0b";octx.shadowColor="#f59e0b";octx.shadowBlur=8;octx.fill();octx.shadowBlur=0;
      const tri=(ax,ay,up)=>{octx.beginPath();octx.moveTo(ax,ay);up?octx.lineTo(ax-6,ay+12):octx.lineTo(ax-6,ay-12);up?octx.lineTo(ax+6,ay+12):octx.lineTo(ax+6,ay-12);octx.closePath();octx.fillStyle="#f59e0b";octx.fill();};
      tri(x,oBpmY0+14,true);tri(x,oTocoY1-14,false);
    });

    // Label section
    octx.shadowBlur=0;octx.textAlign="left";octx.textBaseline="top";octx.font="bold 13px sans-serif";
    octx.fillStyle="#c0392b";octx.fillText("❤ FHR (bpm)",oPL+8,oBpmY0+4);
    octx.fillStyle="#1a5276";octx.fillText("◈ KONTRAKSI (unit)",oPL+8,oTocoY0+4);

    // Masukkan ke PDF
    doc.setFillColor(...C.border);doc.roundedRect(ML+1,y+1,PW,grafikH,2,2,"F");
    doc.setFillColor(253,248,244);doc.setDrawColor(...C.teal);doc.setLineWidth(0.5);
    doc.roundedRect(ML,y,PW,grafikH,2,2,"FD");
    doc.addImage(oc.toDataURL("image/png"),"PNG",ML+1,y+1,PW-2,grafikH-2);
  } catch(e){console.warn("CTG canvas error:",e);}

  // Catatan
  if(p.catatanP){
    doc.setFontSize(6);doc.setFont("helvetica","italic");doc.setTextColor(...C.muted);
    doc.text("Catatan: "+p.catatanP.substring(0,120),ML,H-5.5);
  }

  // Footer
  doc.setFillColor(...C.tealDark);doc.rect(0,H-8,W,8,"F");
  doc.setFillColor(255,255,255);doc.roundedRect(3,H-7.5,7,7,1,1,"F");
  try{doc.addImage(KEMENKES_LOGO,"PNG",3.5,H-7,6,6);}catch(e){}
  doc.setFontSize(5.5);doc.setFont("helvetica","normal");doc.setTextColor(186,230,253);
  doc.text("NST Monitor  |  Kementerian Kesehatan RI  |  Sistem Pemantauan Kardiotokografi (CTG) Digital",W/2,H-4,{align:"center"});
  doc.setTextColor(101,200,220);
  doc.text("* Laporan ini bukan pengganti diagnosis dokter spesialis",W-MR,H-4,{align:"right"});

  if (p.returnBlob) {
    return doc.output("blob");
  }
  doc.save(p.namaFile);
}

function HistGraph({ data, dateLabel, sessionRec, pasien, lastPdfBlob, lastPdfName }) {
  const scrollRef = useRef(null);

  useEffect(() => {
    if (!data) return;
    const bpmArr  = data.bpm_data  || [];
    const tocoArr = data.toco_data || [];
    const bmIdxs  = data.bm_indexes || [];
    const nF = bpmArr.length;
    if (nF === 0) return;

    // Canvas dengan lebar proporsional waktu nyata
    const oPL = 60, oPR = 12, oh = 300;
    const oGW = Math.max(800, nF * PX_PER_PT);
    const ow  = oGW + oPL + oPR;

    const container = scrollRef.current;
    if (!container) return;
    let canvas = container.querySelector("canvas");
    if (!canvas) { canvas = document.createElement("canvas"); container.appendChild(canvas); }
    canvas.width  = ow;
    canvas.height = oh;
    canvas.style.height = oh + "px";
    canvas.style.display = "block";

    renderCTGCanvas(canvas, bpmArr, tocoArr, bmIdxs);
  }, [data]);

  // Export Riwayat sebagai PDF
  const savePDF = () => {
    if (!data) { alert("Data grafik belum termuat."); return; }
    const bpmArr  = data.bpm_data  || [];
    const tocoArr = data.toco_data || [];
    const bmIdxs  = data.bm_indexes || [];
    if (bpmArr.length === 0) { alert("Data sesi ini kosong, tidak ada yang bisa disimpan."); return; }

    const parseDurStr = (s) => {
      if (!s || typeof s !== "string") return 0;
      let total = 0;
      const m1 = s.match(/(\d+)\s*mnt/);  if (m1) total += parseInt(m1[1])*60;
      const m2 = s.match(/(\d+)\s*dtk/);  if (m2) total += parseInt(m2[1]);
      return total;
    };

    const tglIso = (sessionRec?.tanggal || new Date().toISOString().slice(0,10));
    const namaForFile = (pasien?.nama || "Pasien").replace(/ /g,"_");
    const namaFile = "NST_" + namaForFile + "_" + tglIso + ".pdf";

    if (lastPdfBlob && lastPdfName && lastPdfName === namaFile) {
      const url = URL.createObjectURL(lastPdfBlob);
      const a = document.createElement("a");
      a.href = url; a.download = lastPdfName; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      return;
    }

    const nF = bpmArr.length;

    const totalRaw = parseInt(data.total_raw || 0);
    let durSec = totalRaw > 0 ? Math.round(totalRaw * DATA_INTERVAL_S) : 0;
    if (!durSec) durSec = parseDurStr(sessionRec?.durasi);
    if (!durSec) durSec = Math.round(nF * DATA_INTERVAL_S);

    const avgBpm  = Math.round(bpmArr.reduce((a,b)=>a+b,0)/nF);
    const avgToco = tocoArr.length ? Math.round(tocoArr.reduce((a,b)=>a+b,0)/tocoArr.length) : null;

    const durStr = durSec < 60
      ? durSec + " dtk"
      : Math.floor(durSec/60) + " mnt" + (durSec%60 ? " " + durSec%60 + " dtk" : "");

    let tglSesiStr = "-";
    if (sessionRec?.tanggal) {
      try {
        const d = new Date(sessionRec.tanggal + "T00:00:00");
        tglSesiStr = d.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
      } catch(e) { tglSesiStr = sessionRec.tanggal; }
    }
    const jamSesi = sessionRec?.jam || "-";

    // Bookmark count
    const bmCount = (sessionRec?.bm_count != null) ? sessionRec.bm_count : bmIdxs.length;

    generateNSTPDF({
      bpmArr, tocoArr, bmIdxs, durSec,
      avgBpm, avgToco,
      namaP:    pasien?.nama           || "-",
      rmP:      pasien?.no_rekam_medis || "-",
      usiaP:    pasien?.usia_kehamilan ? pasien.usia_kehamilan+" minggu" : "-",
      catatanP: pasien?.catatan        || "",
      tglSesi:  tglSesiStr,
      jamSesi,
      durStr,
      bmStr:    bmCount + "x",
      namaFile,
    });
  };

  return (
    <div>
      {/* Container scrollable — grafik skala waktu nyata (fixed pixel per titik) */}
      <div ref={scrollRef} style={{
        width:"100%", overflowX:"auto", overflowY:"hidden",
        borderRadius:8, border:"1px solid rgba(0,0,0,.07)",
        background:"#fffdf7",
      }} />
      <button onClick={savePDF} style={{
        marginTop:12, padding:"10px 22px",
        background:"linear-gradient(135deg,#0891b2,#0e7490)",
        border:"none", borderRadius:50, color:"#fff",
        fontFamily:F, fontWeight:800, fontSize:13, cursor:"pointer",
        boxShadow:"0 4px 14px rgba(8,145,178,.35)",
      }}>
        📄 Unduh Laporan PDF
      </button>
    </div>
  );
}

            <h2 style={{fontSize:30,fontWeight:900,color:"#1e293b",marginTop:12,letterSpacing:-.5}}>
              Pertanyaan yang Sering Diajukan
            </h2>

          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {faqs.map((f,i) => (
              <div key={i} style={{
                background:activeFaq===i?"#fff":"#fafafa",
                borderRadius:16,border:`1px solid ${activeFaq===i?"#fda4af":"#f1f5f9"}`,
                overflow:"hidden",transition:"all .2s",
                boxShadow:activeFaq===i?"0 4px 20px rgba(244,63,94,.08)":"none",
              }}>
                <button onClick={() => setActiveFaq(activeFaq===i?null:i)} style={{
                  width:"100%",padding:"18px 20px",
                  display:"flex",alignItems:"center",justifyContent:"space-between",
                  background:"transparent",border:"none",cursor:"pointer",
                  fontFamily:F,fontSize:14,fontWeight:700,color:"#1e293b",textAlign:"left",
                }}>
                  <span>{f.q}</span>
                  <span style={{fontSize:18,color:"#f43f5e",flexShrink:0,marginLeft:12,
                    transform:activeFaq===i?"rotate(180deg)":"rotate(0)",transition:"transform .2s"}}>⌄</span>
                </button>
                {activeFaq===i && (
                  <div style={{padding:"0 20px 18px",fontSize:13,color:"#64748b",
                    lineHeight:1.7,animation:"fadeSlideIn .2s ease"}}>{f.a}</div>
                )}
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* ── Footer CTA ── */}
      <div style={{background:"linear-gradient(135deg,#1e293b,#0f172a)",
        padding:"52px 32px",textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:16}}>🌸</div>
        <h2 style={{fontSize:24,fontWeight:900,color:"#fff",marginBottom:10}}>
          Siap Memulai Monitoring?
        </h2>
        <p style={{fontSize:14,color:"#94a3b8",maxWidth:400,margin:"0 auto 28px"}}>
          Login ke sistem untuk mulai memantau kondisi janin secara real-time
        </p>
        <button onClick={onLogin} style={{
          padding:"14px 36px",border:"none",borderRadius:16,
          background:"linear-gradient(135deg,#fb7185,#f43f5e)",
          color:"#fff",fontFamily:F,fontSize:15,fontWeight:800,
          cursor:"pointer",boxShadow:"0 8px 24px rgba(244,63,94,.4)",
        }}>🔐 Login Sekarang</button>
        <div style={{marginTop:32,fontSize:11,color:"#475569",fontFamily:M}}>
          © 2026 NST Monitor · Kementerian Kesehatan RI · Sistem Pemantauan Non-Stress Test
        </div>
      </div>

    </div>
  );
}

//  MAIN APP
function App() {
  const [page,  setPage]  = useState("landing");
  const [tab,   setTab]   = useState("monitor");
  const [user,  setUser]  = useState(null);
  const [loginU, setLoginU] = useState("");
  const [loginP, setLoginP] = useState("");
  const [loginErr, setLoginErr] = useState("");

  // Patient state
  const [patientList,    setPatientList]    = useState([]);
  const [patientLoading, setPatientLoading] = useState(false);
  const [selectedPatient,setSelectedPatient]= useState(null);
  const [showAddForm,    setShowAddForm]    = useState(false);
  const [patientSearch,  setPatientSearch]  = useState("");
  const [newPasien, setNewPasien] = useState({
    nama:"", tanggal_lahir:"", no_rekam_medis:"", usia_kehamilan:"",
    nama_suami:"", no_telp:"", catatan:""
  });
  const [savingPasien, setSavingPasien] = useState(false);
  const [pasienErr,    setPasienErr]    = useState("");

  // Live data state
  const [bpm,    setBpm]    = useState(null);
  const [toco,   setToco]   = useState(null);
  const [bpmH,   setBpmH]   = useState([]);
  const [tocoH,  setTocoH]  = useState([]);
  const [bmIdxs, setBmIdxs] = useState([]);
  const [lastBm, setLastBm] = useState(null);
  // Full-session arrays
  const [bpmFull,    setBpmFull]    = useState([]);
  const [tocoFull,   setTocoFull]   = useState([]);
  const [bmIdxsFull, setBmIdxsFull] = useState([]);
  const [online, setOnline] = useState(false);
  const [lastUpdateStr, setLastUpdateStr] = useState(null);
  // Status koneksi per-sensor
  const [fhrOnline,  setFhrOnline]  = useState(false);
  const [tocoOnline, setTocoOnline] = useState(false);
  // Status recording session
  const [recording,        setRecording]        = useState(false);
  const [sessionId,        setSessionId]        = useState(null);
  const [sessionStartedAt, setSessionStartedAt] = useState(null);
  const [recDuration,      setRecDuration]      = useState(0);
  const [lastRecDuration,  setLastRecDuration]  = useState(0);
  const [lastPdfBlob,      setLastPdfBlob]      = useState(null);
  const [lastPdfName,      setLastPdfName]      = useState("laporan.pdf");

  // History state
  const [histList,    setHistList]    = useState([]);
  const [histLoading, setHistLoading] = useState(false);
  const [selectedDate, setSelectedDate] = useState(null);
  const [histGraphData, setHistGraphData] = useState(null);
  const [histGraphLoading, setHistGraphLoading] = useState(false);
  const [histGraphError, setHistGraphError] = useState("");
  const [histNeedsRefresh, setHistNeedsRefresh] = useState(false);
  const [hasRecordingEnded, setHasRecordingEnded] = useState(false);

  // Refs to avoid stale closures
  const lastTsRef      = useRef(null);
  const lastBmTsRef    = useRef(0);
  const lastBmIdRef    = useRef(0);
  const lastBmMqttRef  = useRef(0);
  const offTimerRef    = useRef(null);
  const bpmHLenRef     = useRef(0);
  const ctgRef         = useRef(null);
  const mqttClientRef  = useRef(null);
  const lastBpmValRef  = useRef(null);
  const lastTocoValRef = useRef(null);
  const prevRecordingRef = useRef(false);
  const recordingRef     = useRef(false);
  const sessionStartedRef = useRef(false);
  const [mqttStatus, setMqttStatus] = useState("connecting");

  // Demo mode
  const [demoMode, setDemoMode] = useState(false);
  const demoIntervalRef = useRef(null);

  bpmHLenRef.current = bpmH.length;

  // Alarms
  const alarmMsgs = [];
  if (bpm  !== null && !isBPMNormal(bpm))  alarmMsgs.push(`DJJ ${bpm} bpm — ${sBPM(bpm)} (Normal: 110–160)`);
  if (toco !== null && !isTOCONormal(toco)) alarmMsgs.push(`TOCO ${toco} unit — ${sTOCO(toco)} (Normal: 25–80)`);

  const processLiveData = useCallback((bpmVal, tocoVal, bmId) => {
    // Update nilai terbaru
    if (bpmVal  !== null && bpmVal  !== undefined) { setBpm(bpmVal);  lastBpmValRef.current  = bpmVal;  }
    if (tocoVal !== null && tocoVal !== undefined) { setToco(tocoVal); lastTocoValRef.current = tocoVal; }

    // Gunakan nilai terakhir jika salah satu null
    const bpmPush  = (bpmVal  !== null && bpmVal  !== undefined) ? bpmVal  : lastBpmValRef.current;
    const tocoPush = (tocoVal !== null && tocoVal !== undefined) ? tocoVal : lastTocoValRef.current;

    // Push ke grafik sliding window
    if (bpmPush !== null || tocoPush !== null) {
      if (bpmPush  !== null) setBpmH(h  => [...h.slice(-1199),  bpmPush]);
      if (tocoPush !== null) setTocoH(h => [...h.slice(-1199), tocoPush]);
      setBmIdxs(prev => prev.map(o => o + 1).filter(o => o < 1200));
    }

    if (recordingRef.current) {
      if (bpmPush  !== null) setBpmFull(h  => [...h, bpmPush]);
      if (tocoPush !== null) setTocoFull(h => [...h, tocoPush]);
    }

    if (bmId && bmId !== lastBmIdRef.current) {
      lastBmIdRef.current = bmId;
      setBmIdxs(prev => [...prev, 0]);
      if (recordingRef.current) {
        setBpmFull(h => { setBmIdxsFull(prev => [...prev, h.length]); return h; });
      }
      setLastBm(new Date().toLocaleTimeString("id-ID",
        {hour:"2-digit", minute:"2-digit", second:"2-digit"}));
    }

    setOnline(true);
    setLastUpdateStr(new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit",second:"2-digit"}));

    if (offTimerRef.current) clearTimeout(offTimerRef.current);
    offTimerRef.current = setTimeout(() => {
      setOnline(false); setBpm(null); setToco(null);
    }, OFFLINE_MS);
    if (offTimerRef.clearChart) clearTimeout(offTimerRef.clearChart);
    offTimerRef.clearChart = setTimeout(() => {
      setBpmH([]); setTocoH([]); setBmIdxs([]);
    }, 60000);
  }, []);

  const fetchLatest = useCallback(async () => {
    try {
      const res = await fetch(API_LATEST + "?t=" + Date.now(), { cache:"no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!data) return;

      const { fhr_online, toco_online } = data;
      setFhrOnline(!!fhr_online);
      setTocoOnline(!!toco_online);

      const recNow = !!data.recording;
      const wasRec = recordingRef.current;
      recordingRef.current = recNow;
      setRecording(recNow);
      setSessionId(data.session_id || null);

      if (recNow) {
        if (!sessionStartedRef.current) {
          sessionStartedRef.current = true;
          if (!wasRec) {
            setSessionStartedAt(new Date().toISOString());
          } else if (data.session_started_at) {
            const serverTime = new Date(data.session_started_at.replace(" ","T") + "+07:00");
            setSessionStartedAt(serverTime.toISOString());
          }
        }
      } else {
        sessionStartedRef.current = false;
        setSessionStartedAt(null);
        setRecDuration(prev => { if (prev > 0) setLastRecDuration(prev); return 0; });
      }

    } catch(e) {
    }
  }, []);

  // Hitung durasi recording secara real-time
  useEffect(() => {
    if (!recording || !sessionStartedAt) { setRecDuration(0); return; }
    const calc = () => {
      const start = new Date(sessionStartedAt);
      setRecDuration(Math.floor((Date.now() - start.getTime()) / 1000));
    };
    calc();
    const iv = setInterval(calc, 1000);
    return () => clearInterval(iv);
  }, [recording, sessionStartedAt]);

  // Load patients when pilih_pasien page is shown
  useEffect(() => {
    if (page !== "pilih_pasien") return;
    loadPatients();
  }, [page]);

  // MQTT: connect & subscribe
  useEffect(() => {
    if (page !== "dashboard" || demoMode) return;

    const client = mqtt.connect(`wss://${MQTT_HOST}:${MQTT_PORT}/mqtt`, {
      username: MQTT_USER,
      password: MQTT_PASS,
      clientId: "web_nst_" + Math.random().toString(16).slice(2, 8),
      clean: true,
      reconnectPeriod: 3000,
    });

    mqttClientRef.current = client;
    setMqttStatus("connecting");

    client.on("connect", () => {
      setMqttStatus("connected");
      client.subscribe(TOPIC_FHR);
      client.subscribe(TOPIC_TOCO);
      console.log("[MQTT] Terhubung & subscribe ke", TOPIC_FHR, TOPIC_TOCO);
    });

    client.on("error", (err) => {
      setMqttStatus("error");
      console.error("[MQTT] Error:", err.message);
    });

    client.on("reconnect", () => setMqttStatus("connecting"));
    client.on("offline",   () => setMqttStatus("error"));

    // Buffer
    let fhrBuf  = null;
    let tocoBuf = null;
    let syncTimer = null;

    client.on("message", (topic, payload) => {
      try {
        const msg = JSON.parse(payload.toString());
        if (topic === TOPIC_FHR) {
          fhrBuf = msg.bpm ?? null;
          setFhrOnline(true);
        } else if (topic === TOPIC_TOCO) {
          tocoBuf = msg.toco ?? null;
          setTocoOnline(true);

          if (msg.bookmark === 1) {
            const now = Date.now();
            if (now - lastBmMqttRef.current > 1500) {
              lastBmMqttRef.current = now;
              lastBmIdRef.current = -now;
              setBmIdxs(prev => [...prev, 0]);
              setBpmFull(h => { setBmIdxsFull(prev => [...prev, h.length]); return h; });
              setLastBm(new Date().toLocaleTimeString("id-ID",
                {hour:"2-digit", minute:"2-digit", second:"2-digit"}));
              console.log("[MQTT] Bookmark terdeteksi!", now);
            }
          }
        }

        if (syncTimer) clearTimeout(syncTimer);
        syncTimer = setTimeout(() => {
          const bv = fhrBuf;
          const tv = tocoBuf;
          fhrBuf  = null;
          tocoBuf = null;
          if (bv !== null || tv !== null) processLiveData(bv, tv, null);
        }, 20);

      } catch(e) {
        console.warn("[MQTT] Parse error:", e);
      }
    });

    fetchLatest();
    const sessionPoll = setInterval(fetchLatest, 5000);

    return () => {
      client.end(true);
      mqttClientRef.current = null;
      clearInterval(sessionPoll);
      if (syncTimer) clearTimeout(syncTimer);
      if (offTimerRef.current) clearTimeout(offTimerRef.current);
      if (offTimerRef.clearChart) clearTimeout(offTimerRef.clearChart);
    };
  }, [page, fetchLatest, processLiveData, demoMode]);

  // Handle transisi recording state
  useEffect(() => {

    const wasRecording = prevRecordingRef.current;
    prevRecordingRef.current = recording;

    if (!wasRecording && recording) {
      setBpmFull([]);
      setTocoFull([]);
      setBmIdxsFull([]);
      setHasRecordingEnded(false);
    }

    if (wasRecording && !recording && page === "dashboard") {
      setHasRecordingEnded(true);

      let attempt = 0;
      const tryFetch = () => {
        attempt++;
        fetch(API_HISTORY + "?patient_id=" + (selectedPatient?.id||0) + "&t=" + Date.now())
          .then(r => r.json())
          .then(d => {
            const list = Array.isArray(d) ? d : [];
            setHistList(list);
            setHistLoading(false);
            setHistNeedsRefresh(false);
            if (list.length === 0 && attempt < 5) setTimeout(tryFetch, 2000);
          })
          .catch(() => {
            if (attempt < 5) setTimeout(tryFetch, 2000);
            else setHistLoading(false);
          });
      };
      setHistLoading(true);
      setTimeout(tryFetch, 1500);
    }
  }, [recording]);

  useEffect(() => {
    if (page !== "dashboard" || tab !== "pasien") return;
    loadPatients();
  }, [page, tab]);

  useEffect(() => {
    if (page !== "dashboard" || tab !== "history") return;
    setHistLoading(true);
    fetch(API_HISTORY + "?patient_id=" + (selectedPatient?.id||0) + "&t=" + Date.now())
      .then(r => r.json())
      .then(d => { setHistList(Array.isArray(d) ? d : []); setHistLoading(false); setHistNeedsRefresh(false); })
      .catch(() => { setHistList([]); setHistLoading(false); });
  }, [page, tab, histNeedsRefresh]);

  const fetchHistGraph = (tanggal, session_id) => {
    setHistGraphData(null);
    setHistGraphError("");
    setHistGraphLoading(true);
    const url = session_id
      ? `${API_HISTORY_DATA}?session_id=${session_id}&t=${Date.now()}`
      : `${API_HISTORY_DATA}?date=${tanggal}&t=${Date.now()}`;
    fetch(url)
      .then(async r => {
        const text = await r.text();
        if (!r.ok) {
          throw new Error(`Server ${r.status}: ${text.substring(0,200)}`);
        }
        try { return JSON.parse(text); }
        catch(e) { throw new Error("Response bukan JSON valid: " + text.substring(0,200)); }
      })
      .then(d => {
        if (d && d.error) {
          setHistGraphError(d.error);
          setHistGraphData(null);
        } else if (!d || !Array.isArray(d.bpm_data) || d.bpm_data.length === 0) {
          setHistGraphError("Sesi ini tidak memiliki data grafik tersimpan.");
          setHistGraphData(null);
        } else {
          setHistGraphData(d);
        }
        setHistGraphLoading(false);
      })
      .catch(err => {
        console.error("fetchHistGraph error:", err);
        setHistGraphError(err.message || "Gagal memuat data grafik.");
        setHistGraphLoading(false);
      });
  };

  const loadHistGraph = (tanggal, session_id) => {
    const key = session_id ? String(session_id) : tanggal;
    if (selectedDate === key) {
      setSelectedDate(null);
      setHistGraphData(null);
      setHistGraphError("");
      return;
    }
    setSelectedDate(key);
    fetchHistGraph(tanggal, session_id);
  };

  // Demo Mode
  const startDemo = () => {
    const demoPasien = {
      id: 0,
      nama: "Siti Rahayu (Demo)",
      tanggal_lahir: "1998-03-15",
      no_rekam_medis: "RM-DEMO-001",
      usia_kehamilan: "36",
      nama_suami: "Budi Santoso",
      no_telp: "08123456789",
      catatan: "Pasien simulasi mode demo"
    };
    setDemoMode(true);
    setUser({ name: "Dr. Demo", role: "Mode Demo" });
    setSelectedPatient(demoPasien);
    setPage("dashboard");
    setTab("monitor");
    setBpm(null); setToco(null); setBpmH([]); setTocoH([]); setBmIdxs([]); setLastBm(null); setBpmFull([]); setTocoFull([]); setBmIdxsFull([]);

    let tick = 0;
    let baseBpm = 135, baseToco = 20;
    demoIntervalRef.current = setInterval(() => {
      tick++;
      const nb = Math.round(baseBpm + Math.sin(tick * 0.07) * 12 + (Math.random() - 0.5) * 6);
      const nt = Math.round(baseToco + Math.sin(tick * 0.04) * 18 + (Math.random() - 0.5) * 4);
      const bpmVal  = Math.max(105, Math.min(175, nb));
      const tocoVal = Math.max(5,   Math.min(80,  nt));

      setBpm(bpmVal);
      setToco(tocoVal);
      setBpmH(h => [...h.slice(-179), bpmVal]);
      setTocoH(h => [...h.slice(-179), tocoVal]);
      setBpmFull(h => [...h, bpmVal]);
      setTocoFull(h => [...h, tocoVal]);
      setOnline(true);
      setFhrOnline(true); setTocoOnline(true);
      setLastUpdateStr(new Date().toLocaleTimeString("id-ID", { hour:"2-digit", minute:"2-digit", second:"2-digit" }));

      if (tick % 30 === 0) {
        setBmIdxs(prev => [...prev, bpmHLenRef.current]);
        setBpmFull(h => { setBmIdxsFull(prev => [...prev, h.length - 1]); return h; });
        setLastBm(new Date().toLocaleTimeString("id-ID", { hour:"2-digit", minute:"2-digit", second:"2-digit" }));
      }
    }, POLL_MS);
  };

  const stopDemo = () => {
    if (demoIntervalRef.current) { clearInterval(demoIntervalRef.current); demoIntervalRef.current = null; }
    setDemoMode(false);
    setUser(null);
    setSelectedPatient(null);
    setPage("login");
    setBpm(null); setToco(null); setBpmH([]); setTocoH([]); setBmIdxs([]); setLastBm(null); setBpmFull([]); setTocoFull([]); setBmIdxsFull([]);
    setOnline(false);
    setFhrOnline(false); setTocoOnline(false);
    setRecording(false); setSessionId(null); setSessionStartedAt(null); setRecDuration(0);
  };

  const login = () => {
    if (loginU === "" && loginP === "") {
      setUser({ name:"Dr. Admin", role:"Dokter Spesialis" });
      setPage("pilih_pasien"); setLoginErr("");
    } else {
      setLoginErr("Username atau password salah.");
    }
  };

  // Load patient list
  const loadPatients = () => {
    setPatientLoading(true);
    fetch(API_PATIENTS + "?t=" + Date.now())
      .then(r => r.json())
      .then(d => { setPatientList(Array.isArray(d) ? d : []); setPatientLoading(false); })
      .catch(() => { setPatientList([]); setPatientLoading(false); });
  };

  // Save new patient
  const saveNewPasien = async () => {
    if (!newPasien.nama.trim())              { setPasienErr("Nama pasien wajib diisi."); return; }
    if (!newPasien.tanggal_lahir.trim())     { setPasienErr("Tanggal lahir wajib diisi."); return; }
    if (!newPasien.no_rekam_medis.trim())    { setPasienErr("No. Rekam Medis wajib diisi."); return; }
    if (!newPasien.usia_kehamilan.toString().trim()) { setPasienErr("Usia kehamilan wajib diisi."); return; }

    // Cek duplikat No. Rekam Medis
    const dupRM = patientList.find(p =>
      p.no_rekam_medis &&
      p.no_rekam_medis.trim().toLowerCase() === newPasien.no_rekam_medis.trim().toLowerCase()
    );
    if (dupRM) {
      setPasienErr(`No. Rekam Medis "${newPasien.no_rekam_medis}" sudah terdaftar atas nama ${dupRM.nama}.`);
      return;
    }

    // Cek duplikat Nama
    const dupNama = patientList.find(p =>
      p.nama.trim().toLowerCase() === newPasien.nama.trim().toLowerCase()
    );
    if (dupNama) {
      setPasienErr(`Nama "${newPasien.nama}" sudah terdaftar dengan No. RM ${dupNama.no_rekam_medis || "-"}. Jika ini pasien berbeda, gunakan nama yang lebih spesifik.`);
      return;
    }

    setSavingPasien(true); setPasienErr("");
    try {
      const res = await fetch(API_PATIENTS, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(newPasien)
      });
      const contentType = res.headers.get("content-type") || "";
      if (!contentType.includes("application/json")) {
        const text = await res.text();
        setPasienErr("Server error (bukan JSON): " + text.substring(0, 120));
        setSavingPasien(false);
        return;
      }
      const data = await res.json();
      if (data.status === "ok") {
        await loadPatients();
        setShowAddForm(false);
        setNewPasien({ nama:"", tanggal_lahir:"", no_rekam_medis:"", usia_kehamilan:"", nama_suami:"", no_telp:"", catatan:"" });
      } else {
        setPasienErr(data.error || "Gagal menyimpan.");
      }
    } catch (err) {
      setPasienErr("Koneksi gagal. Cek: (1) URL API sudah benar, (2) file patients.php sudah diupload, (3) config.php sudah diisi.");
      console.error("saveNewPasien error:", err);
    }
    setSavingPasien(false);
  };

  // Select patient & go to dashboard
  const pilihPasien = (p) => {
    setSelectedPatient(p);
    setPage("dashboard");
    setTab("monitor");
    // Reset live data
    setBpm(null); setToco(null); setBpmH([]); setTocoH([]); setBmIdxs([]); setLastBm(null); setBpmFull([]); setTocoFull([]); setBmIdxsFull([]);
    setRecording(false); setSessionId(null); setSessionStartedAt(null); setRecDuration(0);
    fetch(API_ACTIVE, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({patient_id: p.id})
    }).catch(() => {});
  };




  const exportPDF = () => {
    const nF = bpmFull.length;
    if (nF === 0) return;

    // Durasi
    const durSec = lastRecDuration > 0 ? lastRecDuration
                 : recDuration > 0     ? recDuration
                 : Math.round(nF * DATA_INTERVAL_S);

    const avgBpm  = Math.round(bpmFull.reduce((a,b)=>a+b,0)/nF);
    const avgToco = tocoFull.length ? Math.round(tocoFull.reduce((a,b)=>a+b,0)/tocoFull.length) : null;

    const now = new Date();
    const durStr = durSec < 60
      ? durSec + " dtk"

      namaP:    selectedPatient?.nama           || "-",

      tglSesi:  now.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"}),
      jamSesi:  jamMulai,
      durStr, bmStr: bmIdxsFull.length+"x", namaFile,
      returnBlob: true,
    });
    if (blob) {
      setLastPdfBlob(blob);
      setLastPdfName(namaFile);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

                      <span style={{fontSize:11,color:"#94a3b8"}}>🎂 {hitungUsia(selectedPatient.tanggal_lahir)}</span>}
                    {selectedPatient.usia_kehamilan &&
                      <span style={{fontSize:11,color:"#94a3b8"}}>🤰 {selectedPatient.usia_kehamilan} minggu</span>}
                    {selectedPatient.no_telp &&
                      <span style={{fontSize:11,color:"#94a3b8"}}>📱 {selectedPatient.no_telp}</span>}
                    {selectedPatient.nama_suami &&
                      <span style={{fontSize:11,color:"#94a3b8"}}>👨 {selectedPatient.nama_suami}</span>}
                  </div>
                  {selectedPatient.catatan &&
                    <div style={{fontSize:11,color:"#f87171",marginTop:4,fontStyle:"italic"}}>
                      📝 {selectedPatient.catatan}
                    </div>
                  }
                </div>
                <button onClick={()=>setTab("monitor")} style={{
                  padding:"10px 20px", background:"linear-gradient(135deg,#fb7185,#f43f5e)",
                  border:"none", borderRadius:12, color:"#fff",
                  fontFamily:F, fontSize:12, fontWeight:800, cursor:"pointer",
                  boxShadow:"0 4px 14px rgba(244,63,94,.35)", flexShrink:0,
                }}>💗 Monitor Pasien Ini</button>
              </div>
            )}

            {/* ── Header + tombol tambah ── */}
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
              <div>
                <h2 style={{fontSize:18,fontWeight:900,color:"#1e293b"}}>👥 Daftar Pasien</h2>
                <p style={{fontSize:12,color:"#94a3b8",marginTop:2}}>
                  {patientLoading ? "Memuat…" : `${patientList.length} pasien terdaftar`}
                </p>
              </div>
              <button onClick={()=>{setShowAddForm(f=>!f);setPasienErr("");}} style={{
                padding:"10px 20px", background:"linear-gradient(135deg,#fb7185,#f43f5e)",
                border:"none", borderRadius:12, color:"#fff",
                fontFamily:F, fontSize:12, fontWeight:800, cursor:"pointer",
                boxShadow:"0 4px 14px rgba(244,63,94,.3)",
              }}>+ Pasien Baru</button>
            </div>

            {/* ── Form Tambah Pasien ── */}
            {showAddForm && (
              <div style={{
                background:"#fff", borderRadius:20, padding:"22px 24px",
                border:"2px solid #fda4af", marginBottom:20,
                animation:"fadeSlideIn .3s ease",
                boxShadow:"0 8px 28px rgba(253,164,175,.18)",
              }}>
                <h3 style={{fontSize:15,fontWeight:800,color:"#1e293b",marginBottom:18}}>✏️ Data Pasien Baru</h3>

                {[
                  [
                    {k:"nama",          l:"NAMA LENGKAP",           ph:"Nama lengkap pasien", req:true,  t:"text",   w:2},
                    {k:"tanggal_lahir", l:"TANGGAL LAHIR",           ph:"",                   req:true,  t:"date",   w:1},
                  ],[
                    {k:"no_rekam_medis",l:"NO. REKAM MEDIS",         ph:"RM-001",              req:true,  t:"text",   w:1},
                    {k:"usia_kehamilan",l:"USIA KEHAMILAN (minggu)", ph:"32",                  req:true,  t:"number", w:1},
                  ],[
                    {k:"nama_suami",    l:"NAMA SUAMI / WALI",       ph:"Opsional",            req:false, t:"text",   w:1},
                    {k:"no_telp",       l:"NO. TELEPON",              ph:"Opsional",            req:false, t:"text",   w:1},
                  ]
                ].map((row, ri) => (
                  <div key={ri} style={{display:"flex",gap:12,marginBottom:12}}>
                    {row.map(f => (
                      <div key={f.k} style={{flex:f.w}}>
                        <label style={{display:"block",fontSize:10,fontWeight:700,
                          color:"#64748b",marginBottom:5,letterSpacing:.8}}>
                          {f.l}{f.req && <span style={{color:"#f43f5e"}}> *</span>}
                        </label>
                        <input
                          type={f.t} placeholder={f.ph}
                          value={newPasien[f.k]}
                          min={f.t==="number"?1:undefined}
                          max={f.t==="number"?45:undefined}
                          onChange={e=>setNewPasien(p=>({...p,[f.k]:e.target.value}))}
                          style={{width:"100%",padding:"10px 13px",background:"#f8fafc",
                            border:"2px solid #e2e8f0",borderRadius:10,fontSize:13,
                            fontFamily:F,outline:"none",color:"#1e293b"}}
                          onFocus={e=>e.target.style.borderColor="#fda4af"}
                          onBlur={e=>e.target.style.borderColor="#e2e8f0"}
                        />
                      </div>
                    ))}
                  </div>
                ))}

                <div style={{marginBottom:14}}>
                  <label style={{display:"block",fontSize:10,fontWeight:700,
                    color:"#64748b",marginBottom:5,letterSpacing:.8}}>CATATAN TAMBAHAN</label>
                  <textarea placeholder="Riwayat, kondisi khusus, dll. (opsional)"
                    value={newPasien.catatan} rows={2}
                    onChange={e=>setNewPasien(p=>({...p,catatan:e.target.value}))}
                    style={{width:"100%",padding:"10px 13px",background:"#f8fafc",
                      border:"2px solid #e2e8f0",borderRadius:10,fontSize:13,
                      fontFamily:F,outline:"none",color:"#1e293b",resize:"vertical",lineHeight:1.6}}
                    onFocus={e=>e.target.style.borderColor="#fda4af"}
                    onBlur={e=>e.target.style.borderColor="#e2e8f0"}
                  />
                </div>

                {pasienErr && (
                  <div style={{background:"#fff1f2",border:"1px solid #fecdd3",borderRadius:10,
                    padding:"10px 14px",marginBottom:12,fontSize:12,color:"#b91c1c",fontWeight:700}}>
                    ⚠️ {pasienErr}
                  </div>
                )}

                <div style={{display:"flex",gap:10}}>
                  <button onClick={saveNewPasien} disabled={savingPasien} style={{
                    padding:"11px 24px",
                    background: savingPasien ? "#fda4af" : "linear-gradient(135deg,#fb7185,#f43f5e)",
                    border:"none",borderRadius:10,color:"#fff",fontFamily:F,
                    fontSize:13,fontWeight:800,cursor: savingPasien ? "not-allowed" : "pointer",
                    opacity: savingPasien ? 0.7 : 1,
                    boxShadow:"0 4px 14px rgba(244,63,94,.3)",
                  }}>
                    {savingPasien ? "⏳ Menyimpan…" : "💾 Simpan Pasien"}
                  </button>
                  <button onClick={()=>{setShowAddForm(false);setPasienErr("");}} style={{
                    padding:"11px 18px",background:"#f1f5f9",border:"none",
                    borderRadius:10,color:"#64748b",fontFamily:F,
                    fontSize:13,fontWeight:700,cursor:"pointer",
                  }}>Batal</button>
                </div>
              </div>
            )}

            {/* ── Cari ── */}
            <div style={{position:"relative",marginBottom:14}}>
              <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",fontSize:15}}>🔍</span>
              <input
                placeholder="Cari nama atau no. rekam medis..."
                value={patientSearch}
                onChange={e=>setPatientSearch(e.target.value)}
                style={{width:"100%",padding:"11px 14px 11px 40px",background:"rgba(255,255,255,.9)",
                  border:"2px solid #e2e8f0",borderRadius:14,fontSize:13,
                  fontFamily:F,outline:"none",color:"#1e293b"}}
                onFocus={e=>e.target.style.borderColor="#fda4af"}
                onBlur={e=>e.target.style.borderColor="#e2e8f0"}
              />
            </div>

            {/* ── Daftar ── */}
            {patientLoading ? (
              <div style={{textAlign:"center",padding:40}}>
                <div style={{width:34,height:34,margin:"0 auto",border:"4px solid #fecdd3",
                  borderTopColor:"#f43f5e",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
                <p style={{marginTop:10,color:"#94a3b8",fontSize:13}}>Memuat…</p>
              </div>
            ) : (
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {patientList
                  .filter(p =>
                    p.nama.toLowerCase().includes(patientSearch.toLowerCase()) ||
                    (p.no_rekam_medis||"").toLowerCase().includes(patientSearch.toLowerCase())
                  )
                  .map(p => {
                    const isActive = selectedPatient?.id === p.id;
                    return (
                      <div key={p.id} className="card-h" style={{
                        background: isActive ? "linear-gradient(135deg,#fff1f2,#ffe4e6)" : "rgba(255,255,255,.88)",
                        border:`2px solid ${isActive ? "#fda4af" : "rgba(0,0,0,.06)"}`,
                        borderRadius:16,padding:"15px 18px",
                        display:"flex",alignItems:"center",gap:14,
                        boxShadow: isActive ? "0 4px 18px rgba(253,164,175,.25)" : "0 2px 10px rgba(0,0,0,.04)",
                      }}>
                        {/* Avatar */}
                        <div style={{
                          width:46,height:46,borderRadius:"50%",flexShrink:0,
                          background: isActive
                            ? "linear-gradient(135deg,#fecdd3,#fda4af)"
                            : "linear-gradient(135deg,#f1f5f9,#e2e8f0)",
                          display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,
                        }}>{isActive ? "👩" : "👤"}</div>

                        {/* Info */}
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                            <span style={{fontSize:14,fontWeight:800,
                              color: isActive ? "#f43f5e" : "#1e293b"}}>{p.nama}</span>
                            {isActive && (
                              <span style={{fontSize:9,fontWeight:700,color:"#fff",
                                background:"#f43f5e",borderRadius:50,padding:"2px 8px",fontFamily:M}}>
                                AKTIF
                              </span>
                            )}
                          </div>
                          <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                            {p.no_rekam_medis && <span style={{fontSize:10,color:"#94a3b8"}}>📋 {p.no_rekam_medis}</span>}
                            <span style={{fontSize:10,color:"#94a3b8"}}>🎂 {hitungUsia(p.tanggal_lahir)}</span>
                            {p.usia_kehamilan && <span style={{fontSize:10,color:"#94a3b8"}}>🤰 {p.usia_kehamilan} minggu</span>}
                            {p.no_telp && <span style={{fontSize:10,color:"#94a3b8"}}>📱 {p.no_telp}</span>}
                          </div>
                        </div>

                        {/* Badge & tombol */}
                        <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
                          {p.jumlah_sesi > 0 && (
                            <div style={{textAlign:"center",padding:"4px 12px",
                              background:"rgba(134,239,172,.15)",border:"1px solid #86efac",borderRadius:50}}>
                              <div style={{fontSize:13,fontWeight:900,color:"#16a34a"}}>{p.jumlah_sesi}×</div>
                              <div style={{fontSize:8,color:"#4ade80",fontFamily:M}}>periksa</div>
                            </div>
                          )}
                          {isActive ? (
                            <button onClick={()=>setTab("monitor")} style={{
                              padding:"8px 16px",background:"linear-gradient(135deg,#fb7185,#f43f5e)",
                              border:"none",borderRadius:10,color:"#fff",
                              fontFamily:F,fontSize:11,fontWeight:800,cursor:"pointer",
                              boxShadow:"0 3px 10px rgba(244,63,94,.3)",
                            }}>💗 Monitor</button>
                          ) : (
                            <button onClick={()=>{pilihPasien(p);setTab("monitor");}} style={{
                              padding:"8px 16px",background:"#f1f5f9",
                              border:"1px solid #e2e8f0",borderRadius:10,color:"#475569",
                              fontFamily:F,fontSize:11,fontWeight:700,cursor:"pointer",
                            }}>Pilih →</button>
                          )}
                        </div>
                      </div>
                    );
                  })
                }
                {patientList.filter(p =>
                  p.nama.toLowerCase().includes(patientSearch.toLowerCase()) ||
                  (p.no_rekam_medis||"").toLowerCase().includes(patientSearch.toLowerCase())
                ).length === 0 && (
                  <div style={{textAlign:"center",padding:"40px 0",color:"#94a3b8"}}>
                    <div style={{fontSize:36,marginBottom:10}}>🔍</div>
                    <div style={{fontSize:13,fontWeight:700}}>
                      {patientSearch ? "Pasien tidak ditemukan" : "Belum ada pasien terdaftar"}
                    </div>
                    <div style={{fontSize:11,marginTop:5}}>
                      {patientSearch ? "Coba kata kunci lain" : "Klik + Pasien Baru di atas"}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {/* ══ PANDUAN ══ */}
        {tab === "info" && (
          <div style={{maxWidth:700, animation:"fadeSlideIn .35s ease"}}>
            <h2 style={{fontSize:20,fontWeight:900,color:"#1e293b",marginBottom:20}}>📖 Panduan Penggunaan</h2>
            {[
              {e:"🔌",bg:"#fffbeb",bc:"#fde68a",t:"Koneksi Alat ke Website",
               d:"Dua ESP32 mengirim data FHR dan TOCO secara terpisah setiap 500ms melalui WiFi. Website otomatis menggabungkan dan menampilkan data begitu alat terhubung. Indikator ❤ FHR dan 🌊 TOCO di header menunjukkan status masing-masing sensor."},
              {e:"📊",bg:"#f0f9ff",bc:"#bae6fd",t:"Membaca Parameter",
               d:"BPM (Fetal Heart Rate): nilai normal 110–160 bpm. TOCO (Kontraksi Uterus): nilai normal <50 unit. Status BPM dan TOCO ditampilkan terpisah sehingga lebih mudah dibaca."},
              {e:"⏺",bg:"#fef2f2",bc:"#fecaca",t:"Tombol Start / Stop / Reset",
               d:"START: mulai merekam sesi ke database — indikator ● REC muncul merah berkedip di header beserta durasi rekaman. STOP: hentikan rekaman, data tersimpan di Riwayat. RESET: hentikan rekaman tanpa menghapus data (untuk ganti pasien atau mulai sesi baru)."},
              {e:"🔖",bg:"#fff7ed",bc:"#fed7aa",t:"Bookmark Kontraksi",
               d:"Tombol bookmark ada di alat fisik. Ketika pasien merasakan kontraksi, tekan tombol di alat. Website akan otomatis menampilkan titik kuning (▲) pada grafik CTG di posisi waktu tersebut."},
              {e:"🚨",bg:"#fff1f2",bc:"#fecdd3",t:"Sistem Alarm Otomatis",
               d:"Banner merah berkedip otomatis muncul jika BPM <110 atau >160 bpm, atau TOCO >50 unit. Segera periksa kondisi pasien dan hubungi dokter yang bertugas."},
              {e:"💾",bg:"#f0fdf4",bc:"#bbf7d0",t:"Menyimpan Grafik Riwayat",
               d:"Setiap sesi tersimpan otomatis. Buka tab Riwayat, klik tanggal sesi untuk melihat grafik CTG lengkap, lalu tekan Simpan Grafik untuk mengunduh dalam format PNG."},
            ].map((item,i) => (
              <div key={i} style={{
                display:"flex", gap:16, marginBottom:14,
                background:item.bg, border:`1px solid ${item.bc}`, borderRadius:18, padding:"18px 20px",
              }}>
                <div style={{fontSize:26,flexShrink:0,marginTop:2}}>{item.e}</div>
                <div>
                  <div style={{fontSize:14,fontWeight:800,color:"#1e293b",marginBottom:5}}>{item.t}</div>
                  <div style={{fontSize:13,color:"#475569",lineHeight:1.75}}>{item.d}</div>
                </div>
              </div>
            ))}
          </div>
        )}

      </div>
    </div>
  );
}

// Mount React
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
